conky.config = {
    -- Window Layout Options for Compact Display
    alignment = 'top_right',
    background = false,
    border_width = 1,
    cpu_avg_samples = 2,
    default_color = '#00ffff', -- Tactical Cyan
    default_outline_color = '#000000',
    default_shade_color = '#000000',
    double_buffer = true,
    draw_borders = false,
    draw_graph_borders = true,
    draw_outline = false,
    draw_shading = false,
    extra_newline = false,
    font = 'Monospace:size=9',
    gap_x = 10,
    gap_y = 40,                -- Clears your top panel
    minimum_height = 300,
    minimum_width = 180,
    net_avg_samples = 2,
    no_buffers = true,
    out_to_console = false,
    out_to_ncurses = false,
    out_to_stderr = false,
    out_to_x = true,
    
    -- True Transparency Configurations for XFCE
    own_window = true,
    own_window_class = 'Conky',
    own_window_type = 'normal', 
    own_window_transparent = false, 
    own_window_argb_visual = true,  
    own_window_argb_value = 0,     -- Completely clear background
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    
    show_graph_range = false,
    show_graph_scale = false,
    stippled_borders = 0,
    update_interval = 1.0,
    uppercase = false,
    use_spacer = 'none',
    use_xft = true,
}

conky.text = [[
${color #ff00ff}== QDECK TACTICAL HUD ==${color}
${color #00ffff}Uptime:${color} $uptime

${color #ff00ff}-- NETWORK PORTS --${color}
${color #00ffff}Wi-Fi IP:${color}  ${if_up wlan0}${addr wlan0}
  ${color #00ffff}DL:${color} ${downspeed wlan0} ${goto 105}${color #00ffff}UL:${color} ${upspeed wlan0}
  ${downspeedgraph wlan0 12,70 00ffff ff00ff} ${goto 105}${upspeedgraph wlan0 12,70 00ffff ff00ff}${else}Disconnected${endif}

${color #00ffff}Ethernet:${color}  ${if_up eth0}${addr eth0}
  ${color #00ffff}DL:${color} ${downspeed eth0} ${goto 105}${color #00ffff}UL:${color} ${upspeed eth0}
  ${downspeedgraph eth0 12,70 00ffff ff00ff} ${goto 105}${upspeedgraph eth0 12,70 00ffff ff00ff}${else}No Link${endif}

${color #ff00ff}-- HARDWARE --${color}
${color #00ffff}CPU Load:${color} $cpu% ${alignr}${color #00ffff}Temp:${color} ${exec awk '{print int($1/1000)}' /sys/class/thermal/thermal_zone0/temp}°C
${cpugraph 30,180 00ffff ff00ff}
${color #00ffff}RAM Usage:${color} $mem/$memmax 
${membar 6,180}


${color #ff00ff}-- STORAGE --${color}
${color #00ffff}Root Dir:${color} ${fs_used /}/${fs_size /}
${fs_bar 6,180 /}
]]
